name: Refresh Telegram Bot API schema

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-schema-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh-schema
      - run: npm test
      - run: npm run build
      - name: Commit updated schema
        shell: bash
        run: |
          if git diff --quiet -- data/telegram-bot-api.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram-bot-api.json
          git commit -m "chore: refresh Telegram Bot API schema"
          git push
