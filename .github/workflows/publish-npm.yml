name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag matching the package version
        required: true
        type: string
      prerelease:
        description: Publish with the next npm dist-tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify release version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          package_version="$(node --input-type=commonjs -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$package_version" && "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match package version '$package_version'." >&2
            exit 1
          fi

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Publish package
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
