# cost-policy: GITHUB-ZERO-COST-001
name: Source checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, botify-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate locked dependencies, types, tests, build and audit
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '24') throw new Error('Node 24 required')"
          npm ci --ignore-scripts --no-fund
          npm run check
          npm test
          npm run build
          npm audit
